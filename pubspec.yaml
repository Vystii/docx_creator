name: docx_creator
description: Create, read, and convert DOCX documents in pure Dart — fluent builder API, HTML/Markdown import and export, PDF export with Unicode fallback fonts, and a DOCX/PDF reader.
version: 1.3.4
repository: https://github.com/alihassan143/flutter-packages
homepage: https://github.com/alihassan143/flutter-packages/tree/main/packages/docx_creator
topics:
  - docx
  - pdf
  - markdown
  - html
  - converter

environment:
  sdk: ^3.0.0

dependencies:
  xml: "6.3.0"
  archive: "3.6.1"
  path: "1.8.3"
  image: "4.3.0"
  markdown: "7.2.1"
  html: "0.15.4"
  http: 1.1.0   #/>=1.6.0 <2.0.0"
  uuid: ">=4.6.0 <5.0.0"
  equatable: 2.0.3 #">=2.1.0 <3.0.0"
  pointycastle: "3.8.0"
  crypto: "3.0.3"
  web: "0.1.4-beta"

dev_dependencies:
  lints: 3.0.0 #">=6.1.0 <7.0.0"
  test: "1.25.5"
